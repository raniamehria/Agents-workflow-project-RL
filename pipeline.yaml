# PIPELINE DEFINITION
# Name: luli-rania-yoda-phi3-transformation
# Description: Pipeline that transforms the Yoda dataset for Phi-3 fine-tuning
# Inputs:
#    raw_dataset_uri: str [Default: 'gs://lmr-llmops/yoda_sentences.csv']
#    seed: int [Default: 42.0]
#    test_size: float [Default: 0.2]
components:
  comp-data-transformation-component:
    executorLabel: exec-data-transformation-component
    inputDefinitions:
      parameters:
        raw_dataset_uri:
          parameterType: STRING
        seed:
          defaultValue: 42.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        test_size:
          defaultValue: 0.1
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      parameters:
        test_dataset_path:
          parameterType: STRING
        train_dataset_path:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-data-transformation-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - data_transformation_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'gcsfs'\
          \ 'datasets>=2.20.0' 'pyarrow>=15.0.0'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef data_transformation_component(\n    raw_dataset_uri: str,\n \
          \   train_dataset_path: OutputPath(str),\n    test_dataset_path: OutputPath(str),\n\
          \    test_size: float = 0.1,\n    seed: int = 42,\n):\n    \"\"\"Lit le\
          \ dataset Yoda, le met en format conversation, le d\xE9coupe et l'\xE9crit.\"\
          \"\"\n    import json\n    import logging\n\n    import pandas as pd\n \
          \   from datasets import Dataset\n\n    logging.basicConfig(level=logging.INFO,\
          \ force=True)\n    logger = logging.getLogger(\"data_transformation\")\n\
          \n    def to_conversation(example: dict) -> dict:\n        return {\n  \
          \          \"messages\": [\n                {\"role\": \"user\", \"content\"\
          : example[\"sentence\"]},\n                {\"role\": \"assistant\", \"\
          content\": example[\"translation_extra\"]},\n            ]\n        }\n\n\
          \    def save_dataset_as_csv(dataset: Dataset, path: str) -> None:\n   \
          \     rows = [json.dumps(conversation) for conversation in dataset[\"messages\"\
          ]]\n        pd.DataFrame({\"messages\": rows}).to_csv(path, index=False)\n\
          \n    logger.info(\"Loading raw dataset from %s\", raw_dataset_uri)\n  \
          \  df = pd.read_csv(raw_dataset_uri)\n    logger.info(\"Loaded %d rows with\
          \ columns %s\", len(df), list(df.columns))\n\n    dataset = Dataset.from_pandas(df)\n\
          \    dataset = dataset.map(to_conversation, remove_columns=dataset.column_names)\n\
          \    logger.info(\"Formatted %d conversations\", len(dataset))\n\n    splits\
          \ = dataset.train_test_split(test_size=test_size, seed=seed)\n    train_dataset,\
          \ test_dataset = splits[\"train\"], splits[\"test\"]\n    logger.info(\"\
          Split into %d train / %d test rows\", len(train_dataset), len(test_dataset))\n\
          \n    save_dataset_as_csv(train_dataset, train_dataset_path)\n    save_dataset_as_csv(test_dataset,\
          \ test_dataset_path)\n    logger.info(\"Saved train to %s and test to %s\"\
          , train_dataset_path, test_dataset_path)\n\n"
        image: python:3.11-slim
pipelineInfo:
  description: Pipeline that transforms the Yoda dataset for Phi-3 fine-tuning
  name: luli-rania-yoda-phi3-transformation
root:
  dag:
    tasks:
      data-transformation-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-data-transformation-component
        inputs:
          parameters:
            raw_dataset_uri:
              componentInputParameter: raw_dataset_uri
            seed:
              componentInputParameter: seed
            test_size:
              componentInputParameter: test_size
        taskInfo:
          name: data-transformation-component
  inputDefinitions:
    parameters:
      raw_dataset_uri:
        defaultValue: gs://lmr-llmops/yoda_sentences.csv
        description: URI of the raw CSV on GCS.
        isOptional: true
        parameterType: STRING
      seed:
        defaultValue: 42.0
        description: Random seed for reproducibility.
        isOptional: true
        parameterType: NUMBER_INTEGER
      test_size:
        defaultValue: 0.2
        description: Fraction of the dataset to use as the test split.
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
